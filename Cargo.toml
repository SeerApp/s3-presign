[package]
name = "s3-presign"
version = "0.1.0"
edition = "2021"
description = "Tiny SDK for S3 presigned uploads"
license = "MIT"

[dependencies]
base64 = "0.22"
chrono = "0.4"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
reqwest = { version = "0.12", features = ["multipart", "stream"] }
tokio = { version = "1", features = ["fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "2"

[dev-dependencies]
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["minio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
aws-sdk-s3 = "1"
